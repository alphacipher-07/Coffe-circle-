<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout — Coffee Circle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
</head>
<body>

<div id="cursor-dot"></div>
<div id="cursor-ring"></div>

<header id="site-header" class="solid">
  <nav class="container">
    <div class="logo"><span class="mark"></span>Coffee Circle</div>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li><li><a href="index.html#products">Products</a></li><li><a href="cart.html">Cart</a></li>
    </ul>
    <div class="nav-cta">
      <a href="cart.html" class="cart-link"><svg viewBox="0 0 24 24"><path d="M3 3h2l2.4 12.4a2 2 0 002 1.6h8.4a2 2 0 002-1.6L21 8H6"/><circle cx="9" cy="20" r="1.4"/><circle cx="17" cy="20" r="1.4"/></svg><span class="cart-badge">0</span></a>
    </div>
    <div class="burger"><span></span><span></span><span></span></div>
  </nav>
</header>

<div class="page-banner">
  <div class="container">
    <div class="breadcrumb"><a href="index.html">Home</a> / <a href="cart.html">Cart</a> / Checkout</div>
    <h1>Checkout</h1>
  </div>
</div>

<section id="checkout-page">
  <div class="container" id="checkout-body"></div>
</section>

<footer id="contact">
  <div class="container">
    <div class="footer-bottom" style="margin-top:0; border-top:none;">
      <span>© 2026 Coffee Circle. All rights reserved.</span>
    </div>
  </div>
</footer>

<script src="assets/shop.js"></script>
<script type="module">
import { placeOrder } from './assets/firebase.js';
import { firebaseConfig } from './assets/firebase-config.js';

function firebaseNotConfigured(){
  return !firebaseConfig.apiKey || firebaseConfig.apiKey.includes('YOUR_');
}

function withTimeout(promise, ms){
  return Promise.race([
    promise,
    new Promise((_, reject)=> setTimeout(()=> reject(new Error('timeout')), ms))
  ]);
}

function renderCheckout(){
  const lines = cartLines();
  const body = document.getElementById('checkout-body');

  if(!lines.length){
    body.innerHTML = `
      <div class="cart-empty reveal">
        <p style="font-family:var(--display); font-weight:700; font-size:22px; color:var(--ink); margin-bottom:14px;">Your cart is empty.</p>
        <a href="index.html#products" class="btn btn-brown">Browse Products</a>
      </div>`;
    return;
  }

  const subtotal = cartSubtotal();
  const shipping = cartShipping();
  const total = cartTotal();

  body.innerHTML = `
    <div class="checkout-layout">
      <form class="checkout-form reveal" id="checkout-form">
        <span class="eyebrow">Shipping Details</span>
        <div class="form-row">
          <div class="field"><label>Full Name</label><input type="text" name="name" required></div>
          <div class="field"><label>Phone Number</label><input type="tel" name="phone" required></div>
        </div>
        <div class="field"><label>Email</label><input type="email" name="email" required></div>
        <div class="field"><label>Delivery Address</label><input type="text" name="address" required></div>
        <div class="form-row">
          <div class="field"><label>City</label><input type="text" name="city" required></div>
          <div class="field"><label>Pincode</label><input type="text" name="pincode" required></div>
        </div>
        <span class="eyebrow" style="margin-top:10px;">Payment</span>
        <div class="field">
          <label>Payment Method</label>
          <select name="payment">
            <option>Cash on Delivery</option>
            <option>UPI</option>
            <option>Card</option>
          </select>
        </div>
        <button type="submit" class="btn btn-brown btn-block" style="margin-top:10px;" id="place-order-btn">Place Order — ₹${total}</button>
      </form>

      <div class="checkout-summary reveal">
        <h3>Order Summary</h3>
        ${lines.map(l => `<div class="co-item"><span>${l.name} × ${l.qty}</span><span>₹${l.lineTotal}</span></div>`).join('')}
        <div class="co-item" style="margin-top:14px; padding-top:14px; border-top:1px solid var(--line);"><span>Subtotal</span><span>₹${subtotal}</span></div>
        <div class="co-item"><span>Shipping</span><span>₹${shipping}</span></div>
        <div class="co-item" style="font-weight:700; color:var(--ink); font-size:15px; margin-top:6px;"><span>Total</span><span style="color:var(--brown);">₹${total}</span></div>
      </div>
    </div>
  `;

  document.getElementById('checkout-form').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const btn = document.getElementById('place-order-btn');
    btn.disabled = true;
    btn.textContent = 'Placing order...';

    if(firebaseNotConfigured()){
      btn.disabled = false;
      btn.textContent = `Place Order — ₹${total}`;
      showToast('Firebase not set up yet — add your keys to assets/firebase-config.js');
      return;
    }

    const data = Object.fromEntries(new FormData(e.target).entries());
    const orderPayload = {
      customer: { name:data.name, phone:data.phone, email:data.email, address:data.address, city:data.city, pincode:data.pincode },
      payment: data.payment,
      items: lines.map(l => ({ slug:l.slug, name:l.name, price:l.price, qty:l.qty, lineTotal:l.lineTotal })),
      subtotal, shipping, total
    };

    try{
      const orderId = await withTimeout(placeOrder(orderPayload), 10000);
      clearCart();
      showOrderConfirmation(orderId);
    }catch(err){
      console.error(err);
      btn.disabled = false;
      btn.textContent = `Place Order — ₹${total}`;
      if(err.message === 'timeout'){
        showToast('Order timed out — check Firestore is enabled in Firebase Console');
      }else{
        showToast('Could not place order — check Firebase setup');
      }
    }
  });

  if(typeof gsap !== 'undefined'){
    gsap.utils.toArray('.reveal').forEach(el=>gsap.to(el,{ opacity:1, y:0, duration:0.8, ease:'power3.out' }));
  }
}

function showOrderConfirmation(orderId){
  document.getElementById('checkout-body').innerHTML = `
    <div class="order-confirm">
      <div class="check-circle"><svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg></div>
      <h2>Order Placed!</h2>
      <p>Thank you — your cold brew is on its way. A confirmation has been sent to your email.</p>
      <div class="order-id">Order ID: ${orderId}</div>
      <a href="index.html" class="btn btn-brown" style="margin-top:32px;">Back to Home</a>
    </div>
  `;
}

renderCheckout();
</script>
</body>
</html>
