<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Owner Dashboard — Coffee Circle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<div id="cursor-dot"></div>
<div id="cursor-ring"></div>

<header id="site-header" class="solid">
  <nav class="container">
    <div class="logo"><span class="mark"></span>Coffee Circle <span style="font-family:var(--mono); font-size:11px; color:var(--muted); font-weight:400; margin-left:6px;">— Owner</span></div>
    <ul class="nav-links"><li><a href="index.html">Back to Site</a></li></ul>
    <div class="nav-cta"></div>
    <div class="burger"><span></span><span></span><span></span></div>
  </nav>
</header>

<section id="dashboard">
  <div class="container">

    <div id="dash-login" class="dash-login">
      <span class="eyebrow">Owner Access</span>
      <h1 style="font-family:var(--display); font-weight:800; font-size:28px; margin-top:14px;">Enter Passcode</h1>
      <p style="color:var(--muted); margin-top:10px; font-size:14px;">This is a demo gate for portfolio purposes — not real authentication.</p>
      <input type="password" id="passcode-input" placeholder="Passcode">
      <button class="btn btn-brown btn-block" id="passcode-btn" style="margin-top:16px;">Enter</button>
      <p id="passcode-error" style="color:#B23; font-size:13px; margin-top:12px; display:none;">Incorrect passcode.</p>
    </div>

    <div id="dash-content" style="display:none;">
      <div class="section-head"><span class="eyebrow">Live Orders</span><h2>Owner Dashboard</h2></div>
      <div class="dash-stats">
        <div class="dash-stat"><b id="stat-total">0</b><span>Total Orders</span></div>
        <div class="dash-stat"><b id="stat-pending">0</b><span>Pending</span></div>
        <div class="dash-stat"><b id="stat-revenue">₹0</b><span>Total Revenue</span></div>
      </div>
      <div id="orders-wrap"></div>
    </div>

  </div>
</section>

<script src="assets/shop.js"></script>
<script type="module">
import { listenOrders, setOrderStatus } from './assets/firebase.js';
import { firebaseConfig } from './assets/firebase-config.js';

function firebaseNotConfigured(){
  return !firebaseConfig.apiKey || firebaseConfig.apiKey.includes('YOUR_');
}

const PASSCODE = 'coffeecircle2026'; // change this to whatever you like

document.getElementById('passcode-btn').addEventListener('click', tryLogin);
document.getElementById('passcode-input').addEventListener('keydown', e=>{ if(e.key === 'Enter') tryLogin(); });

function tryLogin(){
  const val = document.getElementById('passcode-input').value;
  if(val === PASSCODE){
    document.getElementById('dash-login').style.display = 'none';
    document.getElementById('dash-content').style.display = 'block';
    startListening();
  }else{
    document.getElementById('passcode-error').style.display = 'block';
  }
}

function startListening(){
  if(firebaseNotConfigured()){
    document.getElementById('orders-wrap').innerHTML = `<div class="dash-empty">Firebase isn't set up yet — add your project keys to assets/firebase-config.js, then reload this page.</div>`;
    return;
  }
  listenOrders((orders, err)=>{
    if(err){
      document.getElementById('orders-wrap').innerHTML = `<div class="dash-empty">Could not load orders — check your Firebase config in assets/firebase-config.js</div>`;
      return;
    }
    renderOrders(orders || []);
  });
}

function renderOrders(orders){
  document.getElementById('stat-total').textContent = orders.length;
  document.getElementById('stat-pending').textContent = orders.filter(o => o.status === 'pending').length;
  const revenue = orders.reduce((sum,o) => sum + (o.total || 0), 0);
  document.getElementById('stat-revenue').textContent = `₹${revenue}`;

  const wrap = document.getElementById('orders-wrap');
  if(!orders.length){
    wrap.innerHTML = `<div class="dash-empty">No orders yet. They'll appear here in real time as customers checkout.</div>`;
    return;
  }

  const rows = orders.map(o => {
    const itemsSummary = (o.items || []).map(i => `${i.name} ×${i.qty}`).join(', ');
    const when = o.createdAt && o.createdAt.toDate ? o.createdAt.toDate().toLocaleString() : '—';
    return `
      <tr>
        <td style="font-family:var(--mono); font-size:11.5px; color:var(--muted);">${o.id.slice(0,8)}</td>
        <td>
          <b>${o.customer ? o.customer.name : '—'}</b><br>
          <span style="color:var(--muted); font-size:12px;">${o.customer ? o.customer.phone : ''}</span>
        </td>
        <td style="max-width:220px;">${itemsSummary}</td>
        <td style="font-family:var(--mono); font-weight:600; color:var(--brown);">₹${o.total || 0}</td>
        <td style="font-size:12px; color:var(--muted);">${when}</td>
        <td><span class="order-status ${o.status || 'pending'}">${o.status || 'pending'}</span></td>
        <td><button class="status-toggle" data-id="${o.id}" data-status="${o.status || 'pending'}">
          ${o.status === 'fulfilled' ? 'Mark Pending' : 'Mark Fulfilled'}
        </button></td>
      </tr>`;
  }).join('');

  wrap.innerHTML = `
    <table class="orders-table">
      <thead><tr><th>Order</th><th>Customer</th><th>Items</th><th>Total</th><th>Placed</th><th>Status</th><th></th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
  `;

  wrap.querySelectorAll('.status-toggle').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const newStatus = btn.dataset.status === 'fulfilled' ? 'pending' : 'fulfilled';
      btn.textContent = 'Updating...';
      try{ await setOrderStatus(btn.dataset.id, newStatus); }
      catch(e){ showToast('Could not update status'); }
    });
  });
}
</script>
</body>
</html>
